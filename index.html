<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Calculadora de Notas</title>
   <link rel="stylesheet" href="Estilos.css">
</head>

<body>

    <div class="contenedor">

        <h1>📚 Calculadora de Notas</h1>

        <p>Ingresa tus notas y calcula el promedio automáticamente.</p>

        <label>¿Cuántas notas vas a ingresar?</label>
        <input type="number" id="cantidad">

        <button onclick="crearCampos()">Crear campos</button>

        <br><br>

        <div id="camposNotas"></div>

        <h2>Resultado</h2>

        <div id="resultado"></div>

    </div>

    <script>

        function crearCampos() {

            let cantidad = document.getElementById("cantidad").value;
            let contenedor = document.getElementById("camposNotas");

            contenedor.innerHTML = "";

            for (let i = 1; i <= cantidad; i++) {

                contenedor.innerHTML += `
                    <p>
                        Nota ${i}:
                        <input type="number" step="0.1" id="nota${i}">
                    </p>
                `;
            }

            contenedor.innerHTML += `
                <button onclick="calcularPromedio()">
                    Calcular Promedio
                </button>
            `;
        }

        function calcularPromedio() {

            let cantidad = document.getElementById("cantidad").value;

            let suma = 0;

            for (let i = 1; i <= cantidad; i++) {

                suma += Number(
                    document.getElementById("nota" + i).value
                );
            }

            let promedio = suma / cantidad;

            let mensaje = "";

            if (promedio >= 3.0) {
                mensaje = "✅ ¡Aprobado!";
            } else {
                mensaje = "❌ Reprobado";
            }

            document.getElementById("resultado").innerHTML =
                `<h3>Promedio: ${promedio.toFixed(2)}</h3>
                 <h3>${mensaje}</h3>`;
        }

    </script>

</body>

</html>
